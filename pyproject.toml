[project]
name = "procom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adhiraj Saha", email = "adhirajfirst@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
procom = "procom:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
